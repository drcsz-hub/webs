<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Retos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .menu {
            background: #242424;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #fff;
        }

        .menu a {
            display: block;
            background: #0088ff;
            color: #fff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            transition: background 0.3s;
        }

        .menu a:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

    <div class="menu">
        <h1>Mis Retos</h1>

        <a href="r2/index.html">Reto 2</a>
        <a href="r3/index.html">Reto 3</a>
        <a href="r4/index.html">Reto 4</a>
        <a href="r5/index.html">Reto 5</a>
    </div>

</body>
</html>
